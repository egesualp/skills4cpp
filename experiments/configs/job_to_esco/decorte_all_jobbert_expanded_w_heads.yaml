project:
  name: "skills4cpp"
  seed: 42

data:
  esco_path: "data/occupations_en_expanded.csv"
  pairs_path:
    - "data/title_pairs_desc/decorte_master_2.csv"
  lowercase: 'both'
  ground_truth_col: "esco_id"
  group_by_col: "job_id"

model:
  hf_id: "TechWolf/JobBERT-v2"
  proj_dim: null
  asymmetric: false
  normalize_output: true
  job_text_key: "anchor"    # For job titles
  esco_text_key: "positive" # For ESCO titles

eval:
  batch_size: 32
  topk: 10
  use_faiss: true
  save_embeddings: true
  save_predictions: true
  cache_dir: "./cache/eval"
  run_name: "infer_decorte_all_jobbert_expanded_final_w_heads"
  clean_cache: true
  compute_skill_coverage: true
  #identity_test: true
