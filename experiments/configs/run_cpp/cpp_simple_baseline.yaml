# Simple CPP Training Configuration
# Reproduces MLP baseline metrics

# Data configuration
data_type: decorte
master_skill_file: /dss/dsshome1/02/ra95kix2/thesis/skills4cpp/results/decorte_jobbert_v2_baseline/job_title_skills_master.csv
esco_skills_file: data/esco_datasets/skills_en.csv
vocab_dir: data/processed/master_datasets_2/
skill_properties_file: data/processed/master_datasets_2/skill_properties_map.json

# Encoder
encoder: ElenaSenger/career-path-representation-mpnet-decorte

# Features
use_text_description: false  # Use titles only
use_skill_description: false
pooling_strategy: weighted_idf
alpha: 1.0
beta: 1.0

# Model architecture
hidden_dim: 512
n_layers: 2
dropout: 0.1

# Training
max_epochs: 50
patience: 5
min_delta: 0.001
batch_size: 512
eval_batch_size: 2048
lr: 0.0001
weight_decay: 0.0001
num_workers: 4

# Device
device: cuda

# Output
output_dir: results/cpp_simple
run_name: cpp_baseline
save_model: true

# WandB
use_wandb: true
wandb_project: cpp-simple
wandb_entity: null

# Cache
embeddings_cache_dir: /dss/dssmcmlfs01/pr74ze/pr74ze-dss-0001/ra95kix2/embeddings
force_recompute: false



